plugins {
    id 'com.android.application' version '8.7.2'
}

android {
    namespace 'com.aura.mobile'
    compileSdk 35
    ndkVersion '27.1.12297006'

    defaultConfig {
        applicationId 'com.aura.mobile'
        minSdk 31
        targetSdk 35
        versionCode 2
        versionName '1.1'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        ndk {
            abiFilters.addAll(providers.gradleProperty('auraAbis').orElse('arm64-v8a,x86_64').get().split(',') as List)
        }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static',
                    "-DQWEN3_TTS_DIR=${rootProject.file('build/qwen3-tts.cpp').absolutePath}",
                    "-DAURA_ARM_ARCH=${providers.gradleProperty('auraArmArch').orElse('armv8-a').get()}"
                targets 'aura_voice'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path '../native/CMakeLists.txt'
            version '3.22.1'
        }
    }

    sourceSets.main.assets.srcDir(rootProject.file('build/assets'))
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.camera:camera-camera2:1.4.2'
    implementation 'androidx.camera:camera-lifecycle:1.4.2'
    implementation 'androidx.camera:camera-view:1.4.2'
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.webkit:webkit:1.12.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
